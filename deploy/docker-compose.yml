# SQLite (single file, cheapest):   docker compose -f deploy/docker-compose.yml up -d
# PostgreSQL:                       docker compose -f deploy/docker-compose.yml --profile postgres up -d
#
# Required in deploy/.env (never commit it):
#   FINANCER_API_TOKEN=<at least 32 random characters, e.g. `openssl rand -hex 32`>
#   DOMAIN=financer.example.com
# For PostgreSQL also: POSTGRES_PASSWORD=<random>  and  FINANCER_DATABASE_URL=postgres://financer:<same password>@postgres/financer
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      FINANCER_API_TOKEN: ${FINANCER_API_TOKEN:?set FINANCER_API_TOKEN in deploy/.env}
      FINANCER_DATABASE_URL: ${FINANCER_DATABASE_URL:-sqlite:///data/financer.db?mode=rwc}
      RUST_LOG: info
    volumes:
      - financer-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - server

  postgres:
    image: postgres:16
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: financer
      POSTGRES_DB: financer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  financer-data:
  caddy-data:
  postgres-data:
