# Development PostgreSQL only (the server and the app run on the host): `make db-up`.
# Not for production, the password is public. Production is deploy/docker-compose.yml.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: financer
      POSTGRES_PASSWORD: financer
      POSTGRES_DB: financer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financer -d financer"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dev-postgres-data:
