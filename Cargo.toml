[workspace]
resolver = "2"
members = ["crates/core", "crates/plaid", "crates/store", "crates/fints", "crates/api", "crates/server", "crates/llm", "crates/recipes", "crates/receipts", "crates/prices", "crates/embedded", "crates/config", "crates/receipt-sources"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-human-readable", "macros", "parsing", "formatting"] }

# scrypt (encrypted backups) is deliberately slow; unoptimized it takes minutes in tests
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
