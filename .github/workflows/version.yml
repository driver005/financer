name: New version

# Every merge (push) to master gets a new version: this workflow works out the next number
# (see .github/scripts/next-version.sh), tags the commit and starts the release build for the tag,
# which builds the apps and attaches them to a GitHub release with generated notes.
#
# Which number: a "feat:" commit or PR title is a minor version, a breaking one ("feat!:" or a
# BREAKING CHANGE line) is major, everything else is a patch. Put [skip release] in the merge
# commit message to skip one. Dependency-only merges (dependabot branches, or changes that touch
# only manifests, lockfiles and workflow files) are skipped on their own and ship with the next
# real release. By hand (Actions tab, "Run workflow") you can force the bump.
# Details: docs/RELEASE.md.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        default: auto
        options: [auto, patch, minor, major]

concurrency:
  group: new-version
  cancel-in-progress: false

permissions:
  contents: write # push the tag
  actions: write # start the release build for it

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Work out the next version
        id: next
        run: |
          version=$(.github/scripts/next-version.sh "${{ inputs.bump || 'auto' }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then echo "Nothing to release." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Tag it and start the release build
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          # A tag pushed with the workflow token does not start other workflows by itself, so
          # start the release build explicitly (dispatching is allowed).
          gh workflow run release.yml --ref "$VERSION"
          echo "Tagged **$VERSION** and started the release build." >> "$GITHUB_STEP_SUMMARY"
