name: nextcloud-cpp

# The C++ plugin runner in nextcloud-cpp/. Runs only when it, or this file, changes.
on:
  push:
    paths:
      - "nextcloud-cpp/**"
      - ".github/workflows/nextcloud-cpp.yml"
  pull_request:
    paths:
      - "nextcloud-cpp/**"
      - ".github/workflows/nextcloud-cpp.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "" is the plain build; the others are congelado's sanitizer configs (nextcloud-cpp/bazel/ci.bazelrc).
        config: ["", "asan", "ubsan", "tsan"]
    defaults:
      run:
        working-directory: nextcloud-cpp
    steps:
      - uses: actions/checkout@v7
      # The toolchain (bazel/toolchain/system_cc) uses the system clang from /usr/bin and lld, like congelado's.
      - name: Install the toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld libclang-rt-dev clang-format-18
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Test
        run: bazelisk test //... ${{ matrix.config != '' && format('--config={0}', matrix.config) || '' }} --config=ci --test_output=errors
      # The style is checked with clang-format 18, the version the files were formatted with; other
      # versions format a few constructs differently.
      - name: Format check
        if: matrix.config == ''
        run: CLANG_FORMAT=clang-format-18 tools/format.sh --check
      - name: Smoke test (the real binary with the built plugins)
        if: matrix.config == ''
        run: tools/smoke.sh

  # congelado builds with clang 22 and C++26: the same tests with that compiler and standard, and with
  # congelado's -Werror warning profile (nextcloud-cpp/warnings.bazelrc).
  clang22:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextcloud-cpp
    steps:
      - uses: actions/checkout@v7
      - name: Install clang 22
        working-directory: .
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22 libclang-rt-22-dev
          sudo ln -sfn ../lib/llvm-22/bin/clang /usr/bin/clang
          sudo ln -sfn ../lib/llvm-22/bin/clang++ /usr/bin/clang++
          sudo ln -sfn ld.lld-22 /usr/bin/ld.lld
          clang --version
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Test (C++26, warnings as errors)
        run: bazelisk test //... --define=std=26 --config=warnings --config=ci --test_output=errors
