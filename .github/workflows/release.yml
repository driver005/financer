name: Release builds

# Builds everything you can install or run:
#   - desktop bundles for Windows, macOS (Apple silicon and Intel) and Linux
#     (server + the web app, started with one double-click; see deploy/desktop/README.txt)
#   - the web app on its own (a zip)
#   - a Docker image on ghcr.io (for your own server)
#   - the Android app (APK) and iOS app through EAS Build (needs the EXPO_TOKEN secret)
# Run it by pushing a version tag (git tag v1.0.0 && git push --tags), or by hand from the
# Actions tab ("Run workflow"). Details and one-time setup: docs/RELEASE.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: What to build
        type: choice
        default: all
        options: [all, desktop-and-web, docker, mobile, android-apk, ios-simulator]
      eas_profile:
        description: EAS build profile for the phone apps (see apps/mobile/eas.json)
        type: choice
        default: preview
        options: [preview, device, production]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'desktop-and-web'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Stamp the tag's version
        if: github.ref_type == 'tag'
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"
      - run: npx expo export --platform web --output-dir dist
        env:
          CI: "1"
      - run: cd dist && zip -qr ../financer-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/mobile/financer-web.zip
      - uses: actions/upload-artifact@v4
        with:
          name: web-files
          path: apps/mobile/dist
          retention-days: 1

  desktop:
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, exe: "", start: start.sh }
          - { name: macos-arm64, os: macos-latest, exe: "", start: start.sh }
          - { name: macos-x64, os: macos-15-intel, exe: "", start: start.sh }
          - { name: windows-x64, os: windows-latest, exe: ".exe", start: start.bat }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the tag's version
        if: github.ref_type == 'tag'
        run: bash .github/scripts/set-rust-version.sh "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@stable
      # Compiled dependencies and workspace libs are restored per platform on later releases.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          cache-on-failure: true
      - run: cargo build --release --locked -p financer-server
      - uses: actions/download-artifact@v4
        with:
          name: web-files
          path: web-files
      - name: Assemble the bundle
        run: |
          dir="financer-desktop-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/financer-server${{ matrix.exe }}" "$dir/"
          cp -r web-files "$dir/web"
          cp "deploy/desktop/${{ matrix.start }}" deploy/desktop/README.txt "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$dir.zip" "$dir" >/dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            financer-desktop-*.zip
            financer-desktop-*.tar.gz
          if-no-files-found: error

  docker:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'docker'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the tag's version
        if: github.ref_type == 'tag'
        run: bash .github/scripts/set-rust-version.sh "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/financer-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mobile:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'mobile'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # an iOS problem (for example missing Apple credentials) must not stop Android
      matrix:
        platform: [android, ios]
    env:
      PROFILE: ${{ inputs.eas_profile || 'preview' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Is the EXPO_TOKEN secret set?
        id: gate
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Phone build skipped::Add the EXPO_TOKEN secret to build the ${{ matrix.platform }} app (docs/RELEASE.md)."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        if: steps.gate.outputs.enabled == 'true'
      - name: Stamp the tag's version
        if: steps.gate.outputs.enabled == 'true' && github.ref_type == 'tag'
        run: |
          node scripts/set-version.mjs "$GITHUB_REF_NAME"
          # EAS builds what is committed, so keep the stamped files in a local commit (never pushed).
          git -c user.name="release build" -c user.email="release-build@users.noreply.github.com" \
            commit -q -m "Version $GITHUB_REF_NAME" -- app.json package.json package-lock.json
      - uses: expo/expo-github-action@v9
        if: steps.gate.outputs.enabled == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build on EAS (waits until it is done)
        if: steps.gate.outputs.enabled == 'true'
        run: eas build --platform ${{ matrix.platform }} --profile "$PROFILE" --non-interactive --json > build.json
      - name: Download the app
        if: steps.gate.outputs.enabled == 'true'
        run: |
          url=$(jq -r '.[0].artifacts.buildUrl // empty' build.json)
          test -n "$url" || { echo "no build URL in the EAS answer"; cat build.json; exit 1; }
          file="financer-${{ matrix.platform }}-$PROFILE.${url##*.}"
          curl -fsSL -o "$file" "$url"
          echo "APP_FILE=$file" >> "$GITHUB_ENV"
          echo "### ${{ matrix.platform }} ($PROFILE)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[0].buildDetailsPageUrl // empty' build.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: app-${{ matrix.platform }}
          path: apps/mobile/${{ env.APP_FILE }}

  android-apk:
    # Installable Android apps built on the runner itself (no Expo account needed), always in both
    # variants:
    #   client  - the app in "Server" mode; it talks to a server you host (needs the server bundle
    #             or the Docker image from this release).
    #   compact - the same app with the Rust backend inside the phone; nothing else to run.
    # Signed with the debug key (fine for installing it yourself, not for the Play Store) unless the
    # four ANDROID_* signing secrets are set, then with your own keystore.
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'android-apk'
    name: android-apk (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant: [client, compact]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.variant == 'compact'
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        if: matrix.variant == 'compact'
      - uses: taiki-e/install-action@v2
        if: matrix.variant == 'compact'
        with:
          tool: cargo-ndk
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Stamp the tag's version
        if: github.ref_type == 'tag'
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"
      - name: Build the Rust backend into the app (compact variant)
        if: matrix.variant == 'compact'
        run: scripts/enable-embedded.sh android
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"
      # Release signing is used only when all four secrets exist; otherwise the debug key signs
      # the APK exactly as before. Setup: docs/RELEASE.md.
      - name: Prepare release signing (only if the keystore secrets are set)
        id: signing
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!v}" ]; then set=$((set + 1)); fi
          done
          if [ "$set" -eq 4 ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "keystore=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          elif [ "$set" -gt 0 ]; then
            echo "::warning title=APK stays debug-signed::Only $set of the 4 Android signing secrets are set (docs/RELEASE.md)."
          else
            echo "::notice title=APK is debug-signed::Add the Android signing secrets to sign with your own key (docs/RELEASE.md)."
          fi
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the release APK
        working-directory: apps/mobile/android
        env:
          SIGNING: ${{ steps.signing.outputs.enabled }}
          FINANCER_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          FINANCER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FINANCER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FINANCER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$SIGNING" = "true" ]; then
            ./gradlew assembleRelease --no-daemon -I "$GITHUB_WORKSPACE/.github/scripts/android-signing.init.gradle"
          else
            ./gradlew assembleRelease --no-daemon
          fi
      - name: Collect the APK
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/*.apk "out/financer-${{ matrix.variant }}-android.apk"
          ls -lh out
      - name: Check who signed the APK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs "out/financer-${{ matrix.variant }}-android.apk" | tee signer.txt
          # The signing step must not have fallen back to the debug key without anyone noticing.
          if grep -qi 'Android Debug' signer.txt; then
            echo "::error::The APK is signed with the debug key although the signing secrets are set."
            exit 1
          fi
          rm signer.txt
      - uses: actions/upload-artifact@v4
        with:
          name: app-android-${{ matrix.variant }}-apk
          path: apps/mobile/out/financer-${{ matrix.variant }}-android.apk

  ios-simulator:
    # iOS apps for the Simulator, unsigned, in both variants (client / compact, see android-apk).
    # They run on an Apple-silicon Mac's Simulator only; installing on an iPhone needs signing,
    # which is what the EAS job above is for. Best effort: a failure here does not block the release.
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'ios-simulator'
    name: ios-simulator (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant: [client, compact]
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.1"
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.variant == 'compact'
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        if: matrix.variant == 'compact'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Stamp the tag's version
        if: github.ref_type == 'tag'
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"
      - name: Build the Rust backend into the app (compact variant)
        if: matrix.variant == 'compact'
        run: scripts/enable-embedded.sh ios
      - name: Generate the native iOS project and install the pods
        run: npx expo prebuild --platform ios
        env:
          CI: "1"
      - name: Build for the Simulator
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace *.xcworkspace -scheme "$(basename *.xcworkspace .xcworkspace)" \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build | tail -40
          exit ${PIPESTATUS[0]}
      - name: Zip the app
        run: |
          mkdir out
          app=$(ls -d ios/build/Build/Products/Release-iphonesimulator/*.app | head -n1)
          ditto -c -k --sequesterRsrc --keepParent "$app" "out/financer-${{ matrix.variant }}-ios-simulator.zip"
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: app-ios-simulator-${{ matrix.variant }}
          path: apps/mobile/out/financer-${{ matrix.variant }}-ios-simulator.zip

  release:
    # Only for version tags: attach everything that was built to a GitHub release.
    # Both variants must be there: the server side (desktop bundles + web) and both Android apps.
    # The iOS Simulator builds are added when they succeeded.
    if: startsWith(github.ref, 'refs/tags/') && !cancelled() && needs.desktop.result == 'success' && needs.web.result == 'success' && needs.android-apk.result == 'success'
    needs: [web, desktop, docker, mobile, android-apk, ios-simulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-body.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{desktop-*,web,app-*}"
          merge-multiple: true
      - run: ls -lh dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: .github/release-body.md
          generate_release_notes: true
