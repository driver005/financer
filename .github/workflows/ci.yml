name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financer
          POSTGRES_PASSWORD: financer
          POSTGRES_DB: financer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U financer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FINANCER_TEST_POSTGRES_URL: postgres://financer:financer@127.0.0.1:5432/financer_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: FinTS client against the fints-rs mock bank (real protocol)
        run: |
          cargo install fints-rs --version 0.2.0 --features server --bin fints-server --root "$RUNNER_TEMP/fints" --locked
          FINTS_MOCK_SERVER="$RUNNER_TEMP/fints/bin/fints-server" cargo test -p financer-fints --test mock_bank
      - name: Native bindings still generate (Kotlin and Swift)
        run: |
          cargo build -p financer-embedded --features bindgen-cli
          for lang in kotlin swift; do
            cargo run -q -p financer-embedded --features bindgen-cli --bin uniffi-bindgen -- \
              generate --library target/debug/libfinancer_embedded.so --language $lang --out-dir "$RUNNER_TEMP/bindings-$lang"
          done
      - name: OpenAPI file is up to date
        run: cargo run -q -p financer-server -- --print-openapi | diff - apps/mobile/openapi.json

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
