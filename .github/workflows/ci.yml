name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financer
          POSTGRES_PASSWORD: financer
          POSTGRES_DB: financer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U financer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FINANCER_TEST_POSTGRES_URL: postgres://financer:financer@127.0.0.1:5432/financer_test
    steps:
      - uses: actions/checkout@v4
      # The release version rules (.github/scripts/next-version.sh); no build needed, runs in seconds.
      - name: Version script tests
        run: bash .github/scripts/test-next-version.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Dependencies and workspace libs are compiled once and restored on later runs (also when a
      # run fails, so the next push does not start from zero).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The two mock bank servers are built from source (several minutes); keep the binaries.
      - name: Cache the FinTS mock banks
        id: fints-mock
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/fints
            ${{ runner.temp }}/fints-decoupled
          key: fints-mock-${{ runner.os }}-fints-rs-0.2.0-${{ hashFiles('crates/fints/tests/mock/**') }}
      - name: Build the FinTS mock banks
        if: steps.fints-mock.outputs.cache-hit != 'true'
        run: |
          cargo install fints-rs --version 0.2.0 --features server --bin fints-server --root "$RUNNER_TEMP/fints" --locked
          crates/fints/tests/mock/build.sh "$RUNNER_TEMP/fints-decoupled"
      - name: FinTS client against the fints-rs mock bank (real protocol, incl. pushTAN approval)
        run: |
          FINTS_MOCK_SERVER="$RUNNER_TEMP/fints/bin/fints-server" \
          FINTS_MOCK_DECOUPLED="$RUNNER_TEMP/fints-decoupled/fints-server" \
            cargo test -p financer-fints --test mock_bank
      - name: Native bindings still generate (Kotlin and Swift)
        run: |
          cargo build -p financer-embedded --features bindgen-cli
          for lang in kotlin swift; do
            cargo run -q -p financer-embedded --features bindgen-cli --bin uniffi-bindgen -- \
              generate --library target/debug/libfinancer_embedded.so --language $lang --out-dir "$RUNNER_TEMP/bindings-$lang"
          done
      - name: OpenAPI file is up to date
        run: cargo run -q -p financer-server -- --print-openapi | diff - apps/mobile/openapi.json

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
