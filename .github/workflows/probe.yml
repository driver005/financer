name: Probe price sources

# Fetches every source in .github/probe/sources.json once, from a GitHub runner, and prints which
# pages were reachable and parsable (see docs/PRICES.md). Polite: robots.txt is obeyed and
# requests are spaced. A runner is a datacenter address, so a block here does not mean a block
# from your home connection. It touches no database.

on:
  push:
    paths:
      - ".github/probe/**"
      - ".github/workflows/probe.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: What do the endpoints really return?
        run: |
          UA="financer-probe/0.1 (personal grocery planner; diagnostics from a CI run)"
          for h in world.openfoodfacts.org prices.openfoodfacts.org; do
            echo "=== robots.txt of $h"; curl -sS -A "$UA" -m 20 "https://$h/robots.txt" | head -40
          done
          echo "=== Open Prices sample"
          curl -sS -A "$UA" -m 20 -w '\nHTTP %{http_code}\n' "https://prices.openfoodfacts.org/api/v1/prices?product_code=3017620422003&currency=EUR&order_by=-date&size=2" | head -c 2500
          for u in https://www.lidl.de/c/billiger-montag/a10006065 https://www.aldi-nord.de/angebote.html; do
            echo "=== $u"
            curl -sS -L -A "$UA" -m 30 -o page.html -w 'HTTP %{http_code}, %{size_download} bytes\n' "$u"
            echo "ld+json blocks: $(grep -c 'application/ld+json' page.html)"
            echo "Product mentions: $(grep -o '"@type":"Product"' page.html | wc -l)"
            grep -o '<title>[^<]*' page.html | head -1
          done

  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p financer-server
      - name: Probe
        env:
          FINANCER_PRICE_SOURCES: .github/probe/sources.json
        run: |
          set +e
          ./target/release/financer-server --probe-prices 2>&1 | tee probe.out
          echo "exit=${PIPESTATUS[0]}"
          { echo '### Price source probe'; echo '```json'; grep -v '^20[0-9][0-9]-' probe.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
