# Weekly dependency update pull requests. Minor and patch updates of an ecosystem arrive as one
# grouped pull request; major updates come separately so they can be read on their own.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Expo pins the versions of its own packages and of React Native per SDK release; moving
      # them one by one breaks the app. Upgrade the SDK by hand (`npx expo install --fix`).
      - dependency-name: expo
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-dom
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: npm
    directory: /apps/shopping
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      shopping-minor-patch:
        update-types: [minor, patch]
    ignore:
      # same Expo pinning rule as apps/mobile
      - dependency-name: expo
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-dom
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: npm
    directory: /packages/shopping
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      shopping-module-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/embedded-bindings
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      bindings-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
