[package]
name = "financer-receipt-sources"
description = "Automatic receipt import: IMAP mailbox, Lidl Plus sign-in via the retailer's own page, watched folder; links receipts to bank transactions"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
financer-core = { path = "../core" }
financer-receipts = { path = "../receipts" }
financer-store = { path = "../store" }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1"
base64 = "0.23"
chacha20poly1305 = "0.10"
futures-util = "0.3"
getrandom = "0.4"
hkdf = "0.13"
mail-parser = { version = "0.11", features = ["full_encoding"] }
pdf-extract = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
time.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tracing = "0.1"
url = "2"
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
toml = "1.1"
