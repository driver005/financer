[package]
name = "financer-config"
description = "The server's configuration: financer.toml plus FINANCER_* environment variables"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
financer-prices = { path = "../prices" }
financer-receipt-sources = { path = "../receipt-sources" }
serde.workspace = true
serde_json.workspace = true
utoipa = { version = "6", optional = true }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }

[features]
# derives the OpenAPI schemas of the types the settings screen exchanges
openapi = ["dep:utoipa"]

[dev-dependencies]
tempfile = "3"
