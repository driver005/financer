[package]
name = "financer-prices"
description = "Price sources: JSON-LD offer pages, Open Food Facts, Open Prices; polite HTTP; normalisation to reference packs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
financer-core = { path = "../core" }
financer-llm = { path = "../llm" }
async-trait = "0.1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
