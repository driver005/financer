[package]
name = "financer-mail-api"
description = "Mail client API: mailbox sync (IMAP), sending (SMTP), chat and topic conversations, templates and the calendar of events found in mail"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
financer-mail-core = { path = "../mail-core" }
financer-mail-store = { path = "../mail-store" }
financer-receipt-sources = { path = "../receipt-sources" }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
mail-builder = "2"
mail-parser = { version = "1.0", features = ["full_encoding"] }
mail-send = { version = "0.7", default-features = false, features = ["aws_lc_rs", "tls12"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tower-http = { version = "0.7", features = ["trace"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tracing = "0.1"
webpki-roots = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64 = "0.23"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
