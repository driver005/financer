[package]
name = "financer-server"
description = "Hosted Financer server: serves the API over TCP on PostgreSQL or SQLite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "financer-server"
path = "src/main.rs"

[dependencies]
financer-api = { path = "../api" }
financer-config = { path = "../config" }
financer-fints = { path = "../fints" }
financer-llm = { path = "../llm" }
financer-prices = { path = "../prices" }
financer-store = { path = "../store" }
serde_json.workspace = true
time.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tower-http = { version = "0.7", features = ["cors"] }
