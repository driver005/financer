[package]
name = "financer-openbanking"
description = "Every way transactions come in, behind one provider trait: CSV import, FinTS, Plaid, GoCardless Bank Account Data and finAPI, mapped to Financer transactions"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["live"]
# The real FinTS client (fints-rs). Disable to build without it, e.g. for tests of other crates.
live = ["dep:fints-rs", "dep:chrono", "dep:rust_decimal"]

[dependencies]
financer-core = { path = "../core" }
async-trait = "0.1"
chrono = { version = "0.4", optional = true }
csv = "1"
fints-rs = { version = "0.2", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
rust_decimal = { version = "1", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
