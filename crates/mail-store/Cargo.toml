[package]
name = "financer-mail-store"
description = "Mail client persistence: messages, calendar events found in them, greeting and closing templates and sync state, with its own migrations (SQLite and PostgreSQL)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
financer-mail-core = { path = "../mail-core" }
sea-orm = { version = "2", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
